# 논문 가져오기 — Claude 작업 공간에서 출판사 사이트가 막혀 있을 때 GitHub 서버가 대신 받아 오는 심부름꾼.
# 결과는 main에 커밋하지 않고 임시 브랜치 fetch/<run_id>로 넘긴 뒤, Claude가 받아 가면 삭제 → 저장소에 원문이 남지 않음.
# 실행: Actions → Fetch papers → Run workflow → Nature 논문 ID를 쉼표로 (예: s41467-024-52766-9,s41467-026-78168-7)
# 정리: ids 칸에 cleanup 입력 → fetch/ 로 시작하는 임시 브랜치를 모두 삭제

name: Fetch papers

on:
  workflow_dispatch:
    inputs:
      ids:
        description: "Nature 논문 ID (쉼표 구분)"
        required: true

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup temporary branches
        if: inputs.ids == 'cleanup'
        run: |
          git init -q tmp && cd tmp
          R="https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          for b in $(git ls-remote --heads "$R" 'fetch/*' | awk '{print $2}'); do
            git push -q "$R" --delete "$b" && echo "deleted $b"
          done

      - name: Download article page, PDF and figures
        if: inputs.ids != 'cleanup'
        env:
          IDS: ${{ inputs.ids }}
        run: |
          set -u
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          mkdir -p out
          for id in $(echo "$IDS" | tr ',' ' '); do
            d="out/$id"; mkdir -p "$d/fig"
            curl -sSL -A "$UA" -o "$d/page.html" "https://www.nature.com/articles/$id" || true
            curl -sSL -A "$UA" -o "$d/paper.pdf" "https://www.nature.com/articles/$id.pdf" || true
            if ! head -c 5 "$d/paper.pdf" | grep -q "%PDF"; then
              curl -sSL -A "$UA" -o "$d/paper.pdf" "https://www.nature.com/articles/${id}_reference.pdf" || true
            fi
            # 본문 Figure 이미지 (고해상도 'full' 우선, 실패하면 lw1200)
            grep -oE '//media\.springernature\.com/[a-z0-9]+/springer-static/image/[^"?]+_Fig[0-9]+_HTML\.(png|jpg)' "$d/page.html" \
              | sed -E 's#^//media\.springernature\.com/[a-z0-9]+/#https://media.springernature.com/full/#' | sort -u > "$d/fig/urls.txt" || true
            while read -r u; do
              f="$d/fig/$(basename "$u")"
              curl -sSL -A "$UA" -o "$f" "$u" || true
              if ! file "$f" | grep -qiE 'image|PNG|JPEG'; then
                curl -sSL -A "$UA" -o "$f" "${u/\/full\//\/lw1200\/}" || true
              fi
            done < "$d/fig/urls.txt"
            echo "== $id"; ls -la "$d" "$d/fig"; file "$d/paper.pdf"
          done

      # Claude 작업 공간은 artifact 저장소에 접근할 수 없어 임시 브랜치로 전달. Claude가 받아 간 뒤 브랜치를 삭제한다.
      - name: Hand over via temporary branch
        if: inputs.ids != 'cleanup'
        run: |
          cd out
          git init -q -b "fetch/${{ github.run_id }}"
          git config user.name "fetch-bot"; git config user.email "fetch-bot@users.noreply.github.com"
          git add -A && git commit -q -m "fetched ${{ inputs.ids }}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "HEAD:refs/heads/fetch/${{ github.run_id }}"
          echo "branch: fetch/${{ github.run_id }}"
