# 주간 뉴스레터 — 한 공장, 두 공정
#   1) 인쇄(publish): site/ 폴더를 GitHub Pages에 게시  → 카톡 버튼이 열 페이지
#   2) 배달(deliver): 카카오톡으로 카드 발송           → 반드시 인쇄가 끝난 뒤
#
# 언제 돌아가나
#   - issues/latest.json 이 바뀌면(=새 호)        : 인쇄 → 배달
#   - site/ 만 바뀌면(=페이지 수정)               : 인쇄만
#   - 매월 15일                                  : 토큰만 갱신 (발송 없음)
#   - 수동(Actions 탭 → Run workflow)            : 아래 mode 선택
#
# 받는 방식 스위치: Settings → Variables → KAKAO_SEND_TARGET
#   memo(기본) = 나와의 채팅 / friends = 다른 계정(B)이 1:1 발송 (docs/FRIEND_MODE.md)
# 사전 설정: Settings → Pages → Source = "GitHub Actions"

name: Weekly newsletter

on:
  push:
    branches: [main]
    paths: ["issues/latest.json", "site/**"]
  schedule:
    - cron: "17 0 15 * *"   # 매월 15일 09:17 KST
  workflow_dispatch:
    inputs:
      mode:
        description: "send = 게시+발송 / publish = 페이지만 게시 / test = 테스트 문구 / keepalive = 토큰 갱신 / list-friends = 친구 uuid 확인"
        type: choice
        options: [send, publish, test, keepalive, list-friends]
        default: test

concurrency:
  group: weekly-newsletter
  cancel-in-progress: false

jobs:
  decide:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.m.outputs.mode }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: m
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ inputs.mode }}"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            mode="keepalive"
          elif git diff --name-only HEAD^ HEAD | grep -qx "issues/latest.json"; then
            mode="send"
          else
            mode="publish"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "이번 실행: $mode"

  publish:
    needs: decide
    if: needs.decide.outputs.mode == 'send' || needs.decide.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

  deliver:
    needs: [decide, publish]
    # 인쇄가 성공했거나(send) 인쇄가 필요 없는 모드(test/keepalive/list-friends)일 때만
    if: >-
      always() && needs.decide.result == 'success' &&
      needs.decide.outputs.mode != 'publish' &&
      (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Wait for Pages to refresh
        if: needs.decide.outputs.mode == 'send'
        run: sleep 30

      - name: Deliver via Kakao
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_SEND_TARGET: ${{ vars.KAKAO_SEND_TARGET || 'memo' }}
          KAKAO_RECEIVER_UUIDS: ${{ vars.KAKAO_RECEIVER_UUIDS }}
          KAKAO_REFRESH_TOKEN: ${{ vars.KAKAO_SEND_TARGET == 'friends' && secrets.KAKAO_SENDER_REFRESH_TOKEN || secrets.KAKAO_REFRESH_TOKEN }}
        run: |
          case "${{ needs.decide.outputs.mode }}" in
            test)         python scripts/send_kakao.py --test ;;
            keepalive)    python scripts/send_kakao.py --keepalive ;;
            list-friends) python scripts/send_kakao.py --list-friends ;;
            send)         python scripts/send_kakao.py --issue issues/latest.json ;;
          esac

      # 카카오가 새 재발급권을 주면 금고(Secrets) 값을 자동 교체 (GH_PAT 필요)
      - name: Rotate refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          SECRET_NAME: ${{ vars.KAKAO_SEND_TARGET == 'friends' && 'KAKAO_SENDER_REFRESH_TOKEN' || 'KAKAO_REFRESH_TOKEN' }}
        run: |
          if [ ! -f new_refresh_token.txt ]; then
            echo "교체할 토큰 없음"; exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::새 refresh_token을 받았지만 GH_PAT이 없어 자동 교체하지 못했습니다."
            rm -f new_refresh_token.txt; exit 0
          fi
          gh secret set "$SECRET_NAME" --repo "${{ github.repository }}" < new_refresh_token.txt
          rm -f new_refresh_token.txt
          echo "$SECRET_NAME 교체 완료"
